# nekozame-emu-frontend's AppImages, built with ES-DE's own scripts: the Steam Deck one and
# the regular x64 one; and nekozame's theme ready-made (nekozame-theme-pack.zip). On a tag
# (v3.5.0-nekozame.1...) they become a release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to publish the release

jobs:
  appimage:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: create_AppImage_SteamDeck.sh
            built: nekozame-emu-frontend-x86_64.AppImage
            name: nekozame-emu-frontend_x64_SteamDeck.AppImage
          - script: create_AppImage.sh
            built: nekozame-emu-frontend-x86_64.AppImage
            name: nekozame-emu-frontend_x64.AppImage
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1  # the build tools are appimages, and runners have no fuse
    steps:
      - uses: actions/checkout@v4
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gettext wget file libharfbuzz-dev libicu-dev \
            libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libfreeimage-dev libfreetype6-dev \
            libgit2-dev libcurl4-openssl-dev libpugixml-dev libasound2-dev libbluetooth-dev libgl1-mesa-dev \
            libpoppler-cpp-dev libsdl2-dev \
            libpipewire-0.3-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdbus-1-dev libudev-dev libdrm-dev libgbm-dev libibus-1.0-dev libdecor-0-dev
      - name: build
        run: |
          tools/${{ matrix.script }}
          # appimagetool names it after the app's name (nekozame-emu-frontend)
          mv "${{ matrix.built }}" "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}

  # the ready-made theme: every system's pages, without anyone's games, and its fonts, for
  # whoever can't print them (nekozame-theme pack); unzipped into ~/ES-DE/themes
  theme-pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pygame fonts-noto-core fonts-noto-cjk fonts-noto-cjk-extra imagemagick zip
      - name: print
        run: |
          python3 nekozame/nekozame-theme pack out
          # smaller pages: every system's, three ways, in five colour schemes
          find out/nekozame/pages -name '*.jpg' -exec mogrify -quality 85 {} +
          (cd out && zip -qr ../nekozame-theme-pack.zip nekozame)
          ls -la nekozame-theme-pack.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nekozame-theme-pack.zip
          path: nekozame-theme-pack.zip
      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: nekozame-theme-pack.zip
